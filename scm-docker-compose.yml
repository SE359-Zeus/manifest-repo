services:
  # 1. The Network Gateway
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-gw-scm
    hostname: scm-be-service
    ports: 
      - "8081:8081"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_ACCEPT_DNS=true
      - TS_EXTRA_ARGS=--netfilter-mode=off --ssh=true
      - TS_AUTH_ONCE=1
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped

  # 2. One-shot migration job
  scm-migrate:
    image: ghcr.io/se359-zeus/zeus-be/scm:v72
    user: "1001:1001"
    command: ["./migrate", "-db", "/app/data/scm.db"]
    volumes:
      - /opt/zeus/scm:/app/data
    restart: "no"

  # 3. One-shot seeder job
  scm-seed:
    image: ghcr.io/se359-zeus/zeus-be/scm:v72
    user: "1001:1001"
    command: ["./seeder", "-db", "/app/data/scm.db", "-manifest-out", "/app/contracts/scm-manifest.json"]
    volumes:
      - /opt/zeus/scm:/app/data
      - /opt/zeus/contracts:/app/contracts
    depends_on:
      scm-migrate:
        condition: service_completed_successfully
    restart: "no"

  # 4. Valkey (Redis-compatible)
  valkey:
    image: valkey/valkey:latest
    network_mode: "service:tailscale"
    restart: unless-stopped

  # 5. scm  backend server
  scm-be:
    image: ghcr.io/se359-zeus/zeus-be/scm:v72
    user: "1001:1001"
    network_mode: "service:tailscale"
    volumes:
      - /opt/zeus/scm:/app/data
      - /opt/zeus/jwt_public.pem:/app/jwt_public.pem:ro
      - /opt/zeus/scm/templates:/app/templates:ro
      - /opt/zeus/contracts:/app/contracts
    env_file:
      - stack.env
    depends_on:
      scm-seed:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    restart: unless-stopped

  # 6. SQLite Client (for manual CLI access)
  sqlite-client:
    image: alpine:latest
    volumes:
      - /opt/zeus/scm:/data
    command: sh -c "apk add --no-cache sqlite && tail -f /dev/null"
    restart: unless-stopped

volumes:
  sqlite_data:
  tailscale-state:
