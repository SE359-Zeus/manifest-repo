services:
  # 1. The Network Gateway
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-gw-system
    hostname: system-be-service
    ports: 
      - "8084:8084"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_ACCEPT_DNS=true
      - TS_EXTRA_ARGS=--netfilter-mode=off --ssh=true
      - TS_AUTH_ONCE=1
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped

  # 2. One-shot migration job
  system-migrate:
    image: ghcr.io/se359-zeus/zeus-be/system:v8
    command: ["./migrate", "-db", "/app/data/system.db"]
    volumes:
      - /opt/zeus/system:/app/data
    restart: "no"

  # 3. One-shot seeder job
  system-seed:
    image: ghcr.io/se359-zeus/zeus-be/system:v8
    command: ["./seeder", "-db", "/app/data/system.db"]
    volumes:
      - /opt/zeus/system:/app/data
    depends_on:
      system-migrate:
        condition: service_completed_successfully
    restart: "no"

  # 4. Valkey (Redis-compatible)
  valkey:
    image: valkey/valkey:latest
    network_mode: "service:tailscale"
    restart: unless-stopped

  # 5. System  backend server
  system-be:
    image: ghcr.io/se359-zeus/zeus-be/system:v8
    network_mode: "service:tailscale"
    volumes:
      - /opt/zeus/system:/app/data
      - /opt/zeus/jwt_public.pem:/app/jwt_public.pem:ro
      - /opt/zeus/jwt_private.pem:/app/jwt_private.pem:ro
    env_file:
      - stack.env
    depends_on:
      system-seed:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    restart: unless-stopped

  # 6. SQLite Client (for manual CLI access)
  sqlite-client:
    image: alpine:latest
    volumes:
      - /opt/zeus/system:/data
    command: sh -c "apk add --no-cache sqlite && tail -f /dev/null"
    restart: unless-stopped

volumes:
  sqlite_data:
  tailscale-state:
